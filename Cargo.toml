# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-whatsapp-module"
version = "0.0.1"
authors = ["ASIMOV Community"]
edition = "2024"
#rust-version = "1.85"
description = "ASIMOV module."
#documentation = "https://docs.rs/asimov-whatsapp-module"
readme = true
homepage = "https://github.com/asimov-modules"
repository = "https://github.com/asimov-modules/asimov-whatsapp-module"
license = "Unlicense"
keywords = ["asimov-module", "asimov", "ai"]
categories = ["command-line-utilities", "text-processing"]              # TODO
publish = false

[features]
default = ["all", "cli", "std"]
all = ["pretty", "tracing"]
cli = ["asimov-module/cli", "std", "dep:clap", "dep:clientele"]
std = ["asimov-module/std", "clap?/std", "clientele?/std"]
unstable = []

# Optional features:
pretty = []
tracing = ["asimov-module/tracing", "clientele?/tracing"]

[dependencies]
asimov-module = { version = "25.0.0-dev.21", default-features = false }
whatsapp-rust = "0.2.0"
wacore-binary = "0.2.0"
waproto = "0.2.0"
qrcode = "0.14.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional integrations:
clap = { version = "4.5", default-features = false, features = [
  "std",
], optional = true }
clientele = { version = "0.3.8", default-features = false, features = [
  "clap",
  "std",
], optional = true }
miette = "7.6.0"

[profile.release]
opt-level = "z"
strip = true
lto = "thin"

[[bin]]
name = "asimov-whatsapp-authorizer"
path = "src/bin/authorizer.rs"
required-features = ["cli"]

[[bin]]
name = "asimov-whatsapp-lister"
path = "src/bin/lister.rs"
required-features = ["cli"]

[[bin]]
name = "asimov-whatsapp-emitter"
path = "src/bin/emitter.rs"
required-features = ["cli"]

[[bin]]
name = "asimov-whatsapp-fetcher"
path = "src/bin/fetcher.rs"
required-features = ["cli"]
